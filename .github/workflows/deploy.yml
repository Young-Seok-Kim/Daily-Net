# main 에 push(= main_qa PR 머지)되면 배포한다.
#
#   서버: functions/ · hosting/ · firebase.json · firestore.rules 가 바뀐 커밋에서만
#         → 서버 테스트 통과 후 firebase deploy --only functions,hosting
#   앱:   app/build.gradle.kts 의 versionCode 가 오른 커밋에서만
#         → 유닛 테스트 → bundleRelease → Play Console 프로덕션 트랙 업로드
#
# 조건을 거는 이유:
# - 앱만 고친 커밋에서 함수를 매번 다시 올리면 3분씩 낭비되고 콜드스타트만 생긴다.
# - 같은 versionCode 를 Play 에 두 번 올리면 거부된다. 버전을 안 올린 커밋은 스토어로 가면 안 된다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  GCP 서비스 계정 키 JSON 내용 그대로 (편집자 역할)
#   PLAY_SERVICE_ACCOUNT_JSON Play Console 에 초대한 서비스 계정 키 JSON 내용 그대로
#   KEYSTORE_BASE64           app/dailynet-key.jks 를 base64 로 (base64 -w0 app/dailynet-key.jks)
#   KEYSTORE_PASSWORD · KEY_ALIAS · KEY_PASSWORD   keystore.properties 의 값들
#   GOOGLE_SERVICES_JSON      app/google-services.json 을 base64 로 (ci.yml 과 같은 형식)
#   GOOGLE_WEB_CLIENT_ID      local.properties 의 값
name: Deploy

on:
  push:
    branches: [main]

# 연달아 머지되면 앞 배포가 끝날 때까지 기다린다. 취소하면 반쯤 올라간 채로 남을 수 있다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    name: 무엇이 바뀌었나
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.detect.outputs.server }}
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # 브랜치가 막 생겼거나(before 가 0) 이전 커밋을 못 찾으면 전부 바뀐 것으로 본다
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "이전 커밋을 알 수 없어 서버·앱 모두 배포 대상으로 둔다"
            exit 0
          fi

          if git diff --quiet "$BEFORE" HEAD -- functions hosting firebase.json firestore.rules; then
            echo "server=false" >> "$GITHUB_OUTPUT"
          else
            echo "server=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff "$BEFORE" HEAD -- app/build.gradle.kts | grep -Eq '^\+\s*versionCode\s*='; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

          echo "서버: $(git diff --quiet "$BEFORE" HEAD -- functions hosting firebase.json firestore.rules && echo 변경없음 || echo 변경됨)"
          echo "앱 versionCode: $(git diff "$BEFORE" HEAD -- app/build.gradle.kts | grep -E '^[-+]\s*versionCode' || echo 변경없음)"

  firebase:
    name: 서버 배포 (functions · hosting)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      # 깨진 서버를 올리지 않는다. ci.yml 과 같은 테스트다.
      - run: npm test

      - name: 서비스 계정 키 준비
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 없다"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: firebase deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        working-directory: .
        run: |
          # --force: index.js 에서 뺀 함수가 있으면 묻지 않고 지운다. 묻는 프롬프트가 뜨면 CI 가 멈춘다.
          npx --yes firebase-tools@15 deploy \
            --only functions,hosting \
            --project daily-net-95d28 \
            --non-interactive \
            --force

  play:
    name: 앱 배포 (Play 프로덕션)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드에 필요한 설정 파일·서명 키 준비
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for v in GOOGLE_SERVICES_JSON GOOGLE_WEB_CLIENT_ID KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::시크릿이 없다:$missing"
            exit 1
          fi

          # 실제 google-services.json. 더미로 만든 AAB 는 로그인·Crashlytics 가 안 되므로 스토어에 올리면 안 된다.
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } > local.properties

          # build.gradle.kts 가 keystore.properties(프로젝트 루트)를 읽어 서명한다. 없으면 미서명으로 떨어진다.
          echo "$KEYSTORE_BASE64" | base64 -d > app/dailynet-key.jks
          {
            echo "storeFile=app/dailynet-key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # 깨진 앱을 올리지 않는다. bundleRelease 와 한 명령에 섞으면 Crashlytics 매핑 업로드 작업이
      # 순서 검증 오류를 내므로 따로 돌린다.
      - name: 유닛 테스트
        run: ./gradlew testDebugUnitTest --console=plain

      - name: AAB 빌드
        run: ./gradlew :app:bundleRelease --console=plain

      - name: 버전·출시 노트 추출
        id: meta
        run: |
          code="$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+')"
          name="$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # CHANGELOG 맨 위 항목의 "### 스토어 문구" 블록이 Play 의 "이 버전의 새로운 기능"이 된다.
          # (다음 ### 제목 전까지. 500자 제한은 CHANGELOG 머리말 참고)
          mkdir -p "$RUNNER_TEMP/whatsnew"
          awk '
            /^## v/ { if (seen) exit; seen = 1; next }
            seen && /^### 스토어 문구/ { grab = 1; next }
            seen && grab && /^### / { exit }
            grab { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR"

          if [ ! -s "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR" ]; then
            echo "::error::CHANGELOG.md 맨 위 항목에 '### 스토어 문구' 블록이 없다"
            exit 1
          fi
          len="$(wc -m < "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR")"
          if [ "$len" -gt 500 ]; then
            echo "::error::스토어 문구가 ${len}자다. Play 는 500자까지만 받는다"
            exit 1
          fi
          echo "--- v$name (b$code) 출시 노트 (${len}자) ---"
          cat "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR"

      - name: Play Console 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.youngs.dailynet
          releaseFiles: app/build/outputs/bundle/release/DailyNet_v${{ steps.meta.outputs.name }}_b${{ steps.meta.outputs.code }}-release.aab
          # R8 매핑. Play Console 의 비정상 종료 스택이 난독화된 채로 보이지 않게 한다.
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          tracks: production
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          releaseName: v${{ steps.meta.outputs.name }} (b${{ steps.meta.outputs.code }})

      # 로컬에서 만든 것과 같은 파일을 남겨 둔다. Play 쪽에 문제가 있어도 여기서 받아 올릴 수 있다.
      - name: AAB 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DailyNet_v${{ steps.meta.outputs.name }}_b${{ steps.meta.outputs.code }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: ignore
